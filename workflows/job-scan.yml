name: Job Scan

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour, on the hour (UTC)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated state back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run job scanner
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/fetch_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json data/new_jobs_report.md
          git diff --quiet --cached || git commit -m "Update job state [skip ci]"
          git push
